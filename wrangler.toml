name = "sessionboard-docs"
compatibility_date = "2026-07-01"
account_id = "7ada9117da7696b9a453aff07ede63f4"
workers_dev = true
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Worker runs on every request: legacy KB 301s, robots.txt, and the
# X-Robots-Tag noindex header on preview hosts (same pattern as growth-pages).
run_worker_first = true

# Release notes by email (src/lib/product-updates-proxy.mjs). The list lives in
# sessionboard-web-api (home region = US); the Worker only relays the form,
# the confirmation link and unsubscribe. PRODUCT_UPDATES_INTERNAL_SECRET is a
# secret (`wrangler secret put`), shared with web-api and the TAM hub.
[vars]
PRODUCT_UPDATES_API_URL = "https://api.sessionboard.com"

# Edge throttle on POST /help/release-notes/subscribe, per visitor IP
# (src/lib/product-updates-proxy.mjs withinRateLimit). 5 attempts a minute is
# plenty for a person retyping an address and starves a script. Counters are
# per server within a colo (not synced), so this is the flood brake; the
# accurate per-visitor limit is web-api's (20/h → 429 "slow_down").
[[ratelimits]]
name = "SUBSCRIBE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# ── Hostnames ──
# A Custom Domain rather than a route: the Worker answers every request from its
# ASSETS binding, so this hostname has no origin at all and cannot 522.
[[routes]]
pattern = "help.sessionboard.com"
custom_domain = true

# The legacy HubSpot KB host, released by HubSpot on 2026-08-07. Which of these two
# is canonical is decided by site.json, not here: the Worker 301s every legacy host
# to the canonical one, so both hostnames must be bound either way.
[[routes]]
pattern = "learn.sessionboard.com"
custom_domain = true

# The retired Canny portal: the Worker 301s every path to the release notes
# (site.json `retiredFeedbackHosts`).
[[routes]]
pattern = "feedback.sessionboard.com"
custom_domain = true
