name = "sessionboard-docs"
compatibility_date = "2026-07-01"
account_id = "7ada9117da7696b9a453aff07ede63f4"
workers_dev = true
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Worker must run first so legacy /en/knowledge-base/* URLs hit the redirect map.
run_worker_first = ["/en/knowledge-base/*", "/knowledge-base/*", "/sitemap.xml"]

