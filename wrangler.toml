name = "sessionboard-docs"
compatibility_date = "2026-07-01"
account_id = "7ada9117da7696b9a453aff07ede63f4"
workers_dev = true
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Worker runs on every request: legacy KB 301s, robots.txt, and the
# X-Robots-Tag noindex header on preview hosts (same pattern as growth-pages).
run_worker_first = true

# ── Hostnames ──
# A Custom Domain rather than a route: the Worker answers every request from its
# ASSETS binding, so this hostname has no origin at all and cannot 522.
[[routes]]
pattern = "help.sessionboard.com"
custom_domain = true

# learn.sessionboard.com cannot be served from this zone yet. HubSpot still holds
# it as a Cloudflare-for-SaaS custom hostname, so Cloudflare answers 1034 (Edge IP
# Restricted) for anything we try to serve there — proxying our own DNS record is
# not sufficient. A HubSpot admin has to detach the domain from the KB first; then
# add it here as a route. See the cutover section in LAUNCH.md.
# [[routes]]
# pattern = "learn.sessionboard.com/*"
# zone_name = "sessionboard.com"
