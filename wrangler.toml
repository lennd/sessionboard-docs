name = "sessionboard-docs"
compatibility_date = "2026-07-01"
account_id = "7ada9117da7696b9a453aff07ede63f4"
workers_dev = true
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Worker runs on every request: legacy KB 301s, robots.txt, and the
# X-Robots-Tag noindex header on preview hosts (same pattern as growth-pages).
run_worker_first = true

# ── Hostnames ──
# A Custom Domain rather than a route: the Worker answers every request from its
# ASSETS binding, so this hostname has no origin at all and cannot 522.
[[routes]]
pattern = "help.sessionboard.com"
custom_domain = true

# The legacy HubSpot KB host, released by HubSpot on 2026-08-07. Which of these two
# is canonical is decided by site.json, not here: the Worker 301s every legacy host
# to the canonical one, so both hostnames must be bound either way.
[[routes]]
pattern = "learn.sessionboard.com"
custom_domain = true
