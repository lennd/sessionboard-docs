<p>Speakers are contacts who are assigned to at least one session as a speaker. By creating a speaker, you have completed step one which is creating them as a contact within your event.</p>
<p>For them to appear within the 'Speakers' module, you will need to <strong><a class="intercom-content-link" href="https://learn.sessionboard.com/en/knowledge-base/6283840-creating-assigning-speakers" target="_blank" rel="noopener">assign them as a speaker to a session</a>.</strong></p>
