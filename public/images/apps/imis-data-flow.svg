    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a6c"/></marker>
  </defs>
  <rect width="800" height="380" fill="#ffffff"/>
  <rect x="10" y="20" width="230" height="340" rx="10" fill="#e8eefc" stroke="#2f5bd3" stroke-width="1.5"/>
  <text x="125" y="52" text-anchor="middle" fill="#172033" font-size="17" font-weight="600">Sessionboard</text>
  <g font-size="14" fill="#172033" text-anchor="middle">
