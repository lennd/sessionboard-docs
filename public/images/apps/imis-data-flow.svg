    <rect x="580" y="150" width="190" height="52" rx="6" fill="#ffffff" stroke="#dde2ec"/><text x="675" y="172">Engagement panel</text><text x="675" y="190" fill="#5a6478" font-size="12.5">one summary per member</text>
    <rect x="580" y="212" width="190" height="52" rx="6" fill="#ffffff" stroke="#dde2ec"/><text x="675" y="234">Group membership</text><text x="675" y="252" fill="#5a6478" font-size="12.5">optional, e.g. event speakers</text>
    <rect x="580" y="290" width="190" height="48" rx="6" fill="#ffffff" stroke="#0f7a6c" stroke-dasharray="4 3"/><text x="675" y="311">Member type, status,</text><text x="675" y="328">paid-thru, chapter</text>
