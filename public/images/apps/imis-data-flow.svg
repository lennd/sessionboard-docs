    <rect x="30" y="122" width="190" height="40" rx="6" fill="#ffffff" stroke="#dde2ec"/><text x="125" y="147">Abstract &amp; award reviews</text>
    <rect x="30" y="172" width="190" height="40" rx="6" fill="#ffffff" stroke="#dde2ec"/><text x="125" y="197">Event attendance</text>
    <rect x="30" y="222" width="190" height="40" rx="6" fill="#ffffff" stroke="#dde2ec"/><text x="125" y="247">Award entries</text>
    <rect x="30" y="290" width="190" height="48" rx="6" fill="#ffffff" stroke="#0f7a6c" stroke-dasharray="4 3"/><text x="125" y="311">Member badge on</text><text x="125" y="328">speakers &amp; reviewers</text>
  </g>
  <rect x="300" y="110" width="200" height="104" rx="8" fill="#ffffff" stroke="#dde2ec"/>
  <text x="400" y="138" text-anchor="middle" fill="#172033" font-size="14" font-weight="600">Daily write-back</text>
  <g font-size="13" fill="#5a6478" text-anchor="middle">
    <text x="400" y="160">Match on iMIS ID, then email</text>
    <text x="400" y="178">Changed rows only</text>
    <text x="400" y="196">Every record logged</text>
  </g>
  <path d="M240,162 L296,162" stroke="#2f5bd3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M500,162 L556,162" stroke="#2f5bd3" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M560,314 L244,314" stroke="#0f7a6c" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <rect x="306" y="276" width="188" height="26" rx="13" fill="#e2f3ef"/>
  <text x="400" y="294" text-anchor="middle" fill="#0f7a6c" font-size="13" font-weight="500">Read: member status</text>
  <rect x="560" y="20" width="230" height="340" rx="10" fill="#e2f3ef" stroke="#0f7a6c" stroke-width="1.5"/>
  <text x="675" y="52" text-anchor="middle" fill="#172033" font-size="17" font-weight="600">iMIS</text>
  <text x="675" y="74" text-anchor="middle" fill="#5a6478" font-size="13">Member record (Party)</text>
