extends: substitution
message: "Use '%s' instead of '%s' (see STYLE.md terminology)."
level: warning
ignorecase: true
swap:
  utilize: use
  'prior to': before
  'CFP form': Submission form
  'call-for-papers form': Submission form
  'e-mail': email
  'end user': participant
  'end-user': participant
  whitelist: allowlist
  blacklist: blocklist
  evaluator: reviewer
  evaluators: reviewers
  'evaluator site': review portal
  'evaluator portal': review portal
  'reviewer site': review portal
  'evaluation survey': survey
  'session evaluation': session feedback survey
  'speaker evaluation': speaker feedback survey
  'evaluation plan': review plan
  'evaluation plans': review plans
  'evaluation summary': review summary
  'my evaluations': My reviews
  'review agent': Screener
  microsite: Program Site
  'event site': Program Site
  'application site': Program Site
  workspace: organization
  gatherings: Field Events
  'creator companion': portal
  copilot: Ask
  # The admin agent was renamed Team Lead -> Ask on 2026-10-31 (nomenclature decision F).
  # Case-sensitive: lowercase "team lead" is a real reviewer role (session builds in rounds).
  '(?-i:Team Leads?)': Ask (or an outcome phrasing such as Drafted for you)
