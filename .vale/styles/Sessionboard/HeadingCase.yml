extends: capitalization
message: "Headings use sentence case: '%s'."
level: suggestion
scope: heading
match: $sentence
indicators:
  - ':'
exceptions:
  - Sessionboard
  - HubSpot
  - Bizzabo
  - Swapcard
  - Swoogo
  - Cvent
  - Zapier
  - API
  - SSO
  - SMS
  - CSV
  - XLSX
  - AI
  - CRM
  - FAQ
  - Speaker CRM
  - Program Site
  - DNS
  - SPF
  - DKIM
  - SendGrid
