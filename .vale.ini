StylesPath = .vale/styles
MinAlertLevel = warning

[*.{md,mdx}]
BasedOnStyles = Sessionboard

# Don't lint imports/JSX blocks or code. "ChatGPT, Copilot" is Microsoft Copilot in the list
# of AI assistants, not the old name of Ask, so the Terms rule must not swap it.
TokenIgnores = (import \{[^}]+\} from '[^']+';), (ChatGPT\x2C Copilot)
BlockIgnores = (?s)```.*?```

# Synced from lennd/sessionboard-public-api-docs by scripts/api-docs-sync.mjs: prose is
# edited (and linted) there, and a fix made here is overwritten by the next sync.
[src/content/docs/{api.mdx,api/**}]
BasedOnStyles =

# A page about Microsoft Copilot, where "Copilot" is the product's name, not the old name of Ask.
[src/content/docs/integrations/connect-microsoft-copilot.mdx]
Sessionboard.Terms = NO
