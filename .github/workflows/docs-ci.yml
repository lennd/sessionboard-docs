name: Docs CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build, links, images, redirects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: No external images, every page has a share image
        run: node scripts/check-images.mjs

      - name: Structure and frontmatter follow STYLE.md
        run: node scripts/check-style.mjs

      # Runs before the build because it reports EVERY bad id at once in under a
      # second, where the build fails on the first one from inside a component.
      - name: Personalization markers name things that exist
        run: npm run markers:check

      # A marker naming a renamed feature fails silently at runtime — the block
      # never satisfies, so a customer who owns Awards is told they do not.
      - name: Marker hydrator honours the spec
        run: npm test

      - name: Breadcrumb data is fresh
        run: |
          node scripts/build-breadcrumbs.mjs
          git diff --exit-code src/breadcrumbs.json || {
            echo '::error::src/breadcrumbs.json is stale — run `npm run breadcrumbs` and commit the result.'
            exit 1
          }

      - name: Build (fails on broken internal links)
        run: npm run build

      - name: Redirect map is valid against this build
        run: |
          node scripts/redirects-to-map.mjs
          git diff --exit-code redirects-map.json || {
            echo '::error::redirects-map.json is stale — run `node scripts/redirects-to-map.mjs` after building and commit the result.'
            exit 1
          }

      # The index is what Team Lead retrieves over, so an article that stops
      # producing chunks stops being answerable — silently, and only in the
      # product. Checked here rather than at sync time, where the corpus has
      # already shipped.
      - name: Every article still produces retrievable chunks
        run: npm run index:check

  prose:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vale shells out to mdx2vast to parse .mdx. Without it every run dies with
      # "mdx2vast not found" before linting anything, and fail_on_error does not
      # cover that — it suppresses findings, not a crash.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g mdx2vast

      - uses: errata-ai/vale-action@v2
        with:
          files: src/content/docs
          fail_on_error: false
