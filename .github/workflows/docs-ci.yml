name: Docs CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build, links, images, redirects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: No external images, every page has a share image
        run: node scripts/check-images.mjs

      - name: Structure and frontmatter follow STYLE.md
        run: node scripts/check-style.mjs

      - name: Breadcrumb data is fresh
        run: |
          node scripts/build-breadcrumbs.mjs
          git diff --exit-code src/breadcrumbs.json || {
            echo '::error::src/breadcrumbs.json is stale — run `npm run breadcrumbs` and commit the result.'
            exit 1
          }

      - name: Build (fails on broken internal links)
        run: npm run build

      - name: Redirect map is valid against this build
        run: |
          node scripts/redirects-to-map.mjs
          git diff --exit-code redirects-map.json || {
            echo '::error::redirects-map.json is stale — run `node scripts/redirects-to-map.mjs` after building and commit the result.'
            exit 1
          }

  prose:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vale shells out to mdx2vast to parse .mdx. Without it every run dies with
      # "mdx2vast not found" before linting anything, and fail_on_error does not
      # cover that — it suppresses findings, not a crash.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g mdx2vast

      - uses: errata-ai/vale-action@v2
        with:
          files: src/content/docs
          fail_on_error: false
