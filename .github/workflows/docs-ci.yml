name: Docs CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build, links, images, redirects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: No external images, every page has a share image
        run: node scripts/check-images.mjs

      - name: Structure and frontmatter follow STYLE.md
        run: node scripts/check-style.mjs

      # Release entries are data (src/data/release-notes). An entry that names a
      # module, feature or article that does not exist, or a post-cutover entry
      # missing the answers CS needs, fails here rather than rendering a half
      # card on the public page and the enablement section.
      - name: Release notes answer who / where / how to turn it on
        run: node scripts/check-release-notes.mjs

      # Runs before the build because it reports EVERY bad id at once in under a
      # second, where the build fails on the first one from inside a component.
      - name: Personalization markers name things that exist
        run: npm run markers:check

      # A marker naming a renamed feature fails silently at runtime — the block
      # never satisfies, so a customer who owns Awards is told they do not.
      - name: Marker hydrator honours the spec
        run: npm test

      # The sidebar article is a map of the product's navigation, and navigation
      # is changed in sessionboard-web-api by people with no reason to know this
      # repo exists. A map of a building that has been remodelled is worse for a
      # reader than no map, so shipping a sidebar item the article has never
      # heard of fails here.
      - name: Sidebar article still describes the shipped sidebar
        run: npm run nav:check

      # The Help Center's groups mirror the product's modules (src/data/nav-manifest.json).
      # A renamed or new module fails here instead of surfacing as a reader who cannot find
      # the group. Nav-link coverage gaps are reported in the log, not failed.
      - name: Sidebar groups mirror the product modules
        run: npm run ia:check

      - name: Breadcrumb data is fresh
        run: |
          node scripts/build-breadcrumbs.mjs
          git diff --exit-code src/breadcrumbs.json || {
            echo '::error::src/breadcrumbs.json is stale — run `npm run breadcrumbs` and commit the result.'
            exit 1
          }

      - name: Build (fails on broken internal links)
        run: npm run build

      - name: Redirect map is valid against this build
        run: |
          node scripts/redirects-to-map.mjs
          git diff --exit-code redirects-map.json || {
            echo '::error::redirects-map.json is stale — run `node scripts/redirects-to-map.mjs` after building and commit the result.'
            exit 1
          }

      # The index is what Team Lead retrieves over, so an article that stops
      # producing chunks stops being answerable — silently, and only in the
      # product. Checked here rather than at sync time, where the corpus has
      # already shipped.
      - name: Every article still produces retrievable chunks
        run: npm run index:check

      # The enablement section (/enablement) is open but unlisted. A sidebar
      # link, a sitemap entry or a pasted webhook URL would undo that quietly.
      - name: Enablement section is unlisted and secret-free
        run: npm run internal:check

  # Merging used to publish nothing: the site went live only when someone
  # remembered to run `wrangler deploy` by hand, so main could sit ahead of
  # learn.sessionboard.com indefinitely with nothing saying so.
  #
  # This lives in the CI workflow rather than its own so that `needs: build` is
  # the gate — a broken link, a marker naming a deleted feature, or an article
  # that stopped producing retrievable chunks cannot reach production. It does
  # not wait on Vale, which is advisory by design (`fail_on_error: false`) and
  # should not be able to hold up a publish.
  deploy:
    name: Publish to learn.sessionboard.com
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two merges in quick succession would otherwise race to upload assets, and
    # the loser could overwrite the newer deployment. Queue instead of cancel:
    # every merged commit should reach production.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Rebuilt rather than carried over as an artifact: dist is ~2,000 files
      # including the pagefind index, which costs more to upload and download
      # than to regenerate, and postbuild has to emit _internal/help-index.json
      # either way.
      - run: npm run build

      - name: Deploy Worker and assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The edge keeps serving the previous HTML after a deploy (a cache rule on
      # the zone caches everything, so even a 404 for a path that now exists
      # survives) — the first deploy of /enablement failed its own smoke test on
      # a cached 404 from before the deploy. Purge, then test what people see.
      - name: Purge the edge cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=sessionboard.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).result[0].id")
          ok=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$zone/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).success")
          [ "$ok" = true ] || { echo "::warning::edge cache purge failed — the smoke test below may see stale pages"; }
          sleep 5

      # A deploy that returns success can still serve a broken site — the
      # 2026-07 incident was a published stylesheet that hid every article while
      # every status code stayed 200. These are the assertions that would have
      # caught the failures we have actually had.
      - name: Smoke test the published site
        run: |
          set -euo pipefail
          base=https://learn.sessionboard.com

          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 3 "$base/")
          [ "$code" = 200 ] || { echo "::error::home returned $code"; exit 1; }

          # The canonical host must never inherit the preview host's noindex.
          # Headers are captured first rather than piped into grep: `grep -q`
          # exits on the first match, curl takes SIGPIPE, and under pipefail that
          # non-zero status would read as "no header found" — the check would
          # pass precisely when it should fail.
          headers=$(curl -sI --retry 3 --retry-delay 3 "$base/")
          if grep -qi 'x-robots-tag' <<<"$headers"; then
            echo "::error::canonical host is sending X-Robots-Tag — it would deindex the Help Center"
            exit 1
          fi

          # The legacy KB host has to keep redirecting; 311 mapped URLs depend on it.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://help.sessionboard.com/)
          [ "$code" = 301 ] || { echo "::error::help.sessionboard.com returned $code, expected 301"; exit 1; }

          # The whole corpus in one GET. Unauthenticated callers get the same 404
          # an unknown path gets, so a regression here is a data leak, not a 500.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/_internal/help-index.json")
          [ "$code" = 404 ] || { echo "::error::/_internal/ answered $code unauthenticated, expected 404"; exit 1; }

          # The enablement section is open but must never be indexed or cached.
          prefix=$(node -p "require('./site.json').internalPrefix")
          headers=$(curl -sI --retry 3 --retry-delay 3 "$base/$prefix")
          grep -qi '^x-robots-tag: noindex' <<<"$headers" || { echo "::error::/$prefix/ is missing X-Robots-Tag: noindex"; exit 1; }
          grep -qi '^cache-control: private, no-store' <<<"$headers" || { echo "::error::/$prefix/ is cacheable"; exit 1; }

          echo "Published and smoke-tested $base"

  prose:
    name: Vale prose lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vale shells out to mdx2vast to parse .mdx. Without it every run dies with
      # "mdx2vast not found" before linting anything, and fail_on_error does not
      # cover that — it suppresses findings, not a crash.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g mdx2vast

      - uses: errata-ai/vale-action@v2
        with:
          files: src/content/docs
          fail_on_error: false
